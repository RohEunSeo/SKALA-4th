spring:
  application:
    name: skala-shopapi
  
  datasource:
    url: jdbc:h2:mem:shop
    driver-class-name: org.h2.Driver
    username: admin
    password: 
  
  h2:
    console:
      enabled: true
      path: /h2-console
  
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
  
  sql:
    init:
      mode: always
      data-locations: classpath:data.sql

# mybatis:
#   mapper-locations: classpath:mapper/**/*.xml
#   type-aliases-package: com.skala.stock.entity
#   configuration:
#     map-underscore-to-camel-case: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

jwt:
  secret: skala-shop-api-jwt-secret-key-please-change-in-production
  expiration-ms: 3600000

server:
  port: 8080

logging:
  level:
    com.sk.skala.shopapi: DEBUG
    org.springframework.web: INFO
