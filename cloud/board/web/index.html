<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>미니 게시판</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Apple SD Gothic Neo', sans-serif; background: #f0f2f5; min-height: 100vh; padding: 40px 20px; }
    .container { max-width: 680px; margin: 0 auto; }
    h1 { font-size: 26px; color: #1a1a2e; margin-bottom: 24px; }
    .card { background: white; border-radius: 12px; padding: 24px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .card h2 { font-size: 16px; color: #555; margin-bottom: 16px; font-weight: 600; }
    input, textarea { width: 100%; padding: 12px 14px; border: 1px solid #e0e0e0; border-radius: 8px; font-size: 14px; margin-bottom: 10px; outline: none; font-family: inherit; }
    input:focus, textarea:focus { border-color: #4CAF50; }
    textarea { resize: vertical; height: 100px; }
    .btn { padding: 10px 18px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: background 0.2s; white-space: nowrap; }
    .btn-green { background: #4CAF50; color: white; width: 100%; }
    .btn-green:hover { background: #43a047; }
    .btn-blue { background: #2196F3; color: white; }
    .btn-blue:hover { background: #1976D2; }
    .btn-red { background: #f44336; color: white; }
    .btn-red:hover { background: #d32f2f; }
    .btn-gray { background: #9E9E9E; color: white; }
    .search-row { display: flex; gap: 8px; margin-bottom: 12px; }
    .search-row input { margin-bottom: 0; }
    .post-card { background: white; border-radius: 12px; padding: 20px 24px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); border-left: 4px solid #4CAF50; }
    .post-card h3 { font-size: 16px; margin-bottom: 8px; }
    .post-card p { font-size: 14px; color: #444; line-height: 1.6; margin-bottom: 10px; }
    .post-card small { font-size: 12px; color: #aaa; }
    .post-actions { display: flex; gap: 8px; margin-top: 12px; }
    .edit-area { display: none; margin-top: 10px; }
    .edit-area textarea { margin-bottom: 8px; height: 80px; }
    .edit-buttons { display: flex; gap: 8px; }
    .empty { text-align: center; color: #aaa; font-size: 14px; padding: 30px; }
    .section-title { font-size: 16px; font-weight: 600; color: #333; margin-bottom: 12px; padding-left: 4px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>📋 미니 게시판</h1>

    <!-- 글 작성 -->
    <div class="card">
      <h2>✏️ 새 글 작성</h2>
      <input type="text" id="title" placeholder="제목을 입력하세요" />
      <textarea id="content" placeholder="내용을 입력하세요 (500자 이하)"></textarea>
      <button class="btn btn-green" onclick="createPost()">작성하기</button>
    </div>

    <!-- 검색 -->
    <div class="card">
      <h2>🔍 검색</h2>
      <div class="search-row">
        <input type="text" id="keyword" placeholder="검색어를 입력하세요" onkeydown="if(event.key==='Enter') searchPosts()" />
        <button class="btn btn-blue" onclick="searchPosts()">검색</button>
        <button class="btn btn-gray" onclick="loadPosts()">전체</button>
      </div>
    </div>

    <!-- 게시글 목록 -->
    <div class="section-title">📄 게시글 목록</div>
    <div id="posts"></div>
  </div>

  <script>
    const WAS = 'http://localhost:5001';

    async function loadPosts() {
      document.getElementById('keyword').value = '';
      await fetchPosts(`${WAS}/posts`);
    }

    async function searchPosts() {
      const keyword = document.getElementById('keyword').value.trim();
      if (!keyword) { await loadPosts(); return; }
      await fetchPosts(`${WAS}/posts?q=${encodeURIComponent(keyword)}`);
    }

    async function fetchPosts(url) {
      try {
        const res = await fetch(url);
        const posts = await res.json();
        const div = document.getElementById('posts');
        if (!posts.length) { div.innerHTML = '<div class="empty">게시글이 없습니다.</div>'; return; }
        div.innerHTML = posts.map(p => `
          <div class="post-card" id="post-${p.id}">
            <h3>${p.title}</h3>
            <p id="content-${p.id}">${p.content}</p>
            <small>${p.created_at}</small>
            <div class="post-actions">
              <button class="btn btn-blue" onclick="showEdit(${p.id}, '${escapeStr(p.content)}')">수정</button>
              <button class="btn btn-red" onclick="deletePost(${p.id})">삭제</button>
            </div>
            <div class="edit-area" id="edit-${p.id}">
              <textarea id="edit-content-${p.id}"></textarea>
              <div class="edit-buttons">
                <button class="btn btn-green" onclick="updatePost(${p.id})">저장</button>
                <button class="btn btn-gray" onclick="hideEdit(${p.id})">취소</button>
              </div>
            </div>
          </div>
        `).join('');
      } catch(e) {
        document.getElementById('posts').innerHTML = '<div class="empty">서버 연결 실패</div>';
      }
    }

    function escapeStr(str) {
      return (str || '').replace(/'/g, "\\'").replace(/\n/g, '\\n');
    }

    async function createPost() {
      const title = document.getElementById('title').value.trim();
      const content = document.getElementById('content').value.trim();
      if (!title) { alert('제목을 입력하세요!'); return; }
      if (!content) { alert('내용을 입력하세요!'); return; }
      try {
        const res = await fetch(`${WAS}/posts`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title, content })
        });
        const data = await res.json();
        if (!res.ok) { alert(data.error); return; }
        document.getElementById('title').value = '';
        document.getElementById('content').value = '';
        await loadPosts();
      } catch(e) { alert('작성 실패: 서버 연결을 확인하세요'); }
    }

    function showEdit(id, content) {
      document.getElementById(`edit-${id}`).style.display = 'block';
      document.getElementById(`edit-content-${id}`).value = content.replace(/\\n/g, '\n');
    }

    function hideEdit(id) {
      document.getElementById(`edit-${id}`).style.display = 'none';
    }

    async function updatePost(id) {
      const content = document.getElementById(`edit-content-${id}`).value.trim();
      if (!content) { alert('내용을 입력하세요!'); return; }
      try {
        const res = await fetch(`${WAS}/posts/${id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ content })
        });
        const data = await res.json();
        if (!res.ok) { alert(data.error); return; }
        await loadPosts();
      } catch(e) { alert('수정 실패'); }
    }

    async function deletePost(id) {
      if (!confirm('정말 삭제하시겠습니까?')) return;
      try {
        const res = await fetch(`${WAS}/posts/${id}`, { method: 'DELETE' });
        const data = await res.json();
        if (!res.ok) { alert(data.error); return; }
        await loadPosts();
      } catch(e) { alert('삭제 실패'); }
    }

    loadPosts();
  </script>
</body>
</html>
